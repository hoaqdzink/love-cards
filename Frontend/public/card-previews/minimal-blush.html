<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimal Blush — mẫu</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        height: 100%;
        background: #ffffff;
      }
      .sheet {
        box-sizing: border-box;
        min-height: 760px;
        padding: 56px 40px;
        font-family: "Inter", system-ui, sans-serif;
        color: #334155;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .line {
        margin: 28px 0 24px;
        width: 48px;
        height: 3px;
        background: #e11d48;
        border-radius: 999px;
      }
      p {
        margin: 0 0 12px;
        max-width: 28rem;
        line-height: 1.65;
        font-size: 0.9375rem;
        color: #64748b;
      }
      footer {
        margin-top: 64px;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <h1>Together</h1>
      <div class="line" aria-hidden="true"></div>
      <p>Chúng mình sẽ nói lời hứa trước những người thân yêu nhất.</p>
      <p>Hẹn gặp bạn trong ngày đặc biệt ấy.</p>
      <footer>LoveCards · minimal blush</footer>
    </div>
  </body>
</html>
