<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golden Hour — mẫu</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        height: 100%;
        background: #fffbeb;
      }
      .sheet {
        box-sizing: border-box;
        min-height: 840px;
        padding: 44px 30px 88px;
        font-family: Georgia, serif;
        color: #422006;
        background: linear-gradient(165deg, #fff7ed 0%, #ffedd5 40%, #fde68a 100%);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 2.25rem;
        font-weight: 600;
        color: #b45309;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.6;
      }
      .frame {
        margin-top: 36px;
        padding: 28px;
        border: 2px solid rgba(180, 83, 9, 0.35);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <h1>Golden Hour</h1>
      <p>Ánh nắng cuối ngày, những lời chúc ấm áp và tiếng cười của bạn là món quà lớn nhất.</p>
      <div class="frame">
        <p>15 · 08 · 2026 — Resort ven biển.</p>
        <p>Tiệc cocktail lúc 17:30, tiệc chính lúc 18:30.</p>
        <p>Trang phục: tông ấm, họa tiết nhẹ nhàng.</p>
      </div>
    </div>
  </body>
</html>
