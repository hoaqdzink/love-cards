server:
  port: 8086

spring:
  application:
    name: analytics-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  jpa:
    properties:
      hibernate:
        default_schema: analytics
  flyway:
    schemas: analytics

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
