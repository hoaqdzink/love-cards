server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: template-service
          uri: lb://template-service
          predicates:
            - Path=/api/v1/templates/**,/api/v1/music/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/hosting-plans/**,/api/v1/webhooks/**

        - id: card-service
          uri: lb://card-service
          predicates:
            - Path=/api/v1/cards/**,/api/v1/public/cards/**,/api/v1/upload/**

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/newsletter/**,/api/v1/b2b/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "https://lovecards.vn"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
