server:
  port: 8084

spring:
  application:
    name: card-service
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    properties:
      hibernate:
        default_schema: cards
  flyway:
    schemas: cards

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
