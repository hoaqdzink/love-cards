server:
  port: 8084

spring:
  application:
    name: card-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  jpa:
    properties:
      hibernate:
        default_schema: cards
  flyway:
    schemas: cards

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
