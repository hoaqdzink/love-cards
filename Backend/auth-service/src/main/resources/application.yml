server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    properties:
      hibernate:
        default_schema: auth
  flyway:
    schemas: auth

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
