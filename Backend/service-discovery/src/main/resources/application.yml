# Cấu hình Eureka Server (service-discovery)
# Port 8761 là convention của Netflix Eureka; các microservice trỏ EUREKA_URL về đây.

server:
  port: 8761

spring:
  application:
    name: service-discovery

# Eureka chạy ở chế độ standalone: chỉ làm registry, không tự đăng ký / không fetch danh sách peer.
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
