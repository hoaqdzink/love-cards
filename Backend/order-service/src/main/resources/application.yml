server:
  port: 8083

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    properties:
      hibernate:
        default_schema: commerce
  flyway:
    schemas: commerce

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
