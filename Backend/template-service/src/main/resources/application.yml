# Cấu hình template-service — port 8082, schema DB catalog, cache TTL, seed asset MinIO.

server:
  port: 8082

spring:
  application:
    name: template-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  jpa:
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    schemas: catalog

# TTL cache Redis và seed asset demo (classpath → MinIO).
template:
  cache:
    list-ttl: 5m
    detail-ttl: 10m
    featured-ttl: 15m
    trending-ttl: 15m
    categories-ttl: 30m
    view-dedupe-ttl: 1h
  assets:
    seed-enabled: true
    classpath-root: template-assets

# Đăng ký instance lên Eureka để API Gateway route /api/v1/templates, /music, ...
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
