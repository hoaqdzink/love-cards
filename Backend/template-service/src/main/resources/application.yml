server:
  port: 8082

spring:
  application:
    name: template-service
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    schemas: catalog

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
