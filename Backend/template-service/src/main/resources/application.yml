server:
  port: 8082

spring:
  application:
    name: template-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  jpa:
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    schemas: catalog

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
