<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peony Dream</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: linear-gradient(#fff7fa, #fde7ef); color: #4a2530; }
    .card { min-height: 760px; padding: 72px 28px; text-align: center; box-sizing: border-box; }
    .eyebrow { letter-spacing: .2em; text-transform: uppercase; font: 12px Arial, sans-serif; color: #b76e79; }
    h1 { font-size: 48px; line-height: 1.05; margin: 28px 0 12px; }
    .date { font: 18px Arial, sans-serif; margin: 24px 0; }
    .flower { width: 160px; height: 160px; border-radius: 999px; margin: 36px auto; background: radial-gradient(circle, #fff 0 20%, #f7b6c8 21% 55%, #d97792 56%); opacity: .85; }
    .venue { font: 16px Arial, sans-serif; color: #6b3b46; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Wedding Invitation</p>
    <h1>Minh & Lan</h1>
    <p class="date">Saturday, 12 December 2026</p>
    <div class="flower" aria-hidden="true"></div>
    <p class="venue">The Rose Garden Hall</p>
  </main>
</body>
</html>
