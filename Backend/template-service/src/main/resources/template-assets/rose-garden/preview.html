<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rose Garden</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #22090d; color: #fff8ef; }
    .card { min-height: 760px; padding: 80px 28px; text-align: center; box-sizing: border-box; border: 14px solid #c9a227; }
    .eyebrow { color: #e5c76b; letter-spacing: .22em; text-transform: uppercase; font: 12px Arial, sans-serif; }
    h1 { font-size: 52px; line-height: 1.05; margin: 32px 0 18px; }
    .rose { width: 180px; height: 180px; margin: 36px auto; border-radius: 50%; background: radial-gradient(circle, #ffcad4 0 18%, #c9184a 19% 52%, #800f2f 53%); box-shadow: 0 0 0 10px rgba(201,162,39,.25); }
    p { font: 17px Arial, sans-serif; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">You are invited</p>
    <h1>Anh & Mai</h1>
    <div class="rose" aria-hidden="true"></div>
    <p>18:00 - Grand Ballroom</p>
    <p>12.12.2026</p>
  </main>
</body>
</html>
