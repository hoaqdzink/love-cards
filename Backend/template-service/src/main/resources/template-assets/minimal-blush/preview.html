<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimal Blush</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #fbf5f2; color: #2f2a2a; }
    .card { min-height: 760px; padding: 92px 30px; text-align: center; box-sizing: border-box; }
    .line { width: 84px; height: 2px; background: #d6a4a4; margin: 0 auto 42px; }
    h1 { font-family: Georgia, serif; font-size: 44px; margin: 0 0 18px; }
    .date { letter-spacing: .16em; text-transform: uppercase; color: #8a6a6a; }
    .panel { margin: 56px auto 0; max-width: 300px; padding: 28px; border: 1px solid #ead8d2; border-radius: 28px; background: #fff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="line" aria-hidden="true"></div>
    <h1>Blush Party</h1>
    <p class="date">Save the date</p>
    <div class="panel">
      <p>Saturday evening</p>
      <p>Minimal Hall</p>
      <p>Ho Chi Minh City</p>
    </div>
  </main>
</body>
</html>
